[project]
name = "packagegate-ml"
version = "0.1.0"
description = "Hybrid ML workspace for PackageGate (structured baselines + code encoders)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
torch = [
  "torch>=2.2",
  "transformers>=4.44",
  "accelerate>=0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packagegate_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
